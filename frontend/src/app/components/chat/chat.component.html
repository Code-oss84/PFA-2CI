<div class="max-w-7xl mx-auto px-4 py-8 h-[calc(100vh-8rem)]">
  <div class="flex h-full gap-5">

    <!-- === PANNEAU LATÉRAL DES CONVERSATIONS === -->
    <aside class="w-72 hidden md:flex flex-col card overflow-hidden">
      <!-- Header panneau -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-200">
        <h2 class="text-sm font-semibold tracking-tight text-zinc-800">Conversations</h2>
        <button
          (click)="createConversation()"
          class="btn-ghost p-1.5 rounded-lg"
          title="Nouvelle conversation"
        >
          <mat-icon class="text-[18px]">add</mat-icon>
        </button>
      </div>

      <!-- Liste des conversations -->
      <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
        <div *ngIf="conversations.length === 0" class="text-center text-zinc-400 text-xs py-10">
          <mat-icon class="text-3xl mb-1 block mx-auto text-zinc-300">chat_bubble_outline</mat-icon>
          <p>Aucune conversation</p>
          <p class="mt-0.5">Cliquez sur <strong>+</strong> pour créer</p>
        </div>

        <button
          *ngFor="let conv of conversations"
          (click)="selectConversation(conv.id)"
          class="w-full text-left px-3 py-2.5 rounded-xl transition-colors duration-150 flex items-center gap-3 text-sm"
          [ngClass]="activeConversationId === conv.id
            ? 'bg-primary-50 border border-primary-200 text-primary-700'
            : 'border border-transparent text-zinc-600 hover:bg-zinc-50 hover:text-zinc-800'"
        >
          <mat-icon class="text-[18px] shrink-0"
            [ngClass]="activeConversationId === conv.id ? 'text-primary-500' : 'text-zinc-400'"
          >forum</mat-icon>
          <div class="flex-1 min-w-0">
            <p class="font-medium truncate">{{ conv.title || 'Conversation' }}</p>
            <p class="text-[11px] text-zinc-400 mt-0.5">{{ conv.message_count || 0 }} messages</p>
          </div>
        </button>
      </div>

      <!-- Sélection d'avatar + options -->
      <div class="border-t border-zinc-200 px-5 py-4 space-y-3">
        <div>
          <label class="text-[11px] font-medium uppercase tracking-wider text-zinc-400 mb-1.5 block">Avatar</label>
          <select [(ngModel)]="selectedAvatarId" class="input-field text-sm py-2">
            <option [ngValue]="null">Avatar par défaut</option>
            <option *ngFor="let av of avatars" [ngValue]="av.id">{{ av.name }}</option>
          </select>
        </div>
        <label class="flex items-center justify-between text-xs text-zinc-500">
          <span class="flex items-center gap-1.5">
            <mat-icon class="text-[16px]">volume_up</mat-icon>
            Réponses vocales
          </span>
          <input type="checkbox" [(ngModel)]="useVoice" class="w-4 h-4 accent-primary-600 rounded">
        </label>
      </div>
    </aside>

    <!-- === ZONE DE CHAT === -->
    <main class="flex-1 card flex flex-col overflow-hidden">

      <!-- En-tête du chat -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-200 shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-primary-600 text-white flex items-center justify-center shrink-0">
            <mat-icon class="text-[18px]">smart_toy</mat-icon>
          </div>
          <div>
            <h2 class="text-sm font-semibold tracking-tight text-zinc-800">Assistant pédagogique</h2>
            <p class="text-[11px] text-emerald-500 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
              En ligne
            </p>
          </div>
        </div>

        <button class="md:hidden btn-ghost p-2" (click)="createConversation()">
          <mat-icon class="text-[18px]">add</mat-icon>
        </button>
      </div>

      <!-- Conteneur des messages -->
      <div #messagesContainer class="flex-1 overflow-y-auto px-5 py-4 space-y-4">

        <!-- Message de bienvenue -->
        <div *ngIf="messages.length === 0" class="flex flex-col items-center justify-center h-full text-center">
          <div class="w-14 h-14 rounded-2xl bg-primary-50 flex items-center justify-center mb-3">
            <mat-icon class="text-[28px] text-primary-500">waving_hand</mat-icon>
          </div>
          <p class="text-sm font-medium text-zinc-700">Bonjour ! Je suis votre assistant pédagogique.</p>
          <p class="text-xs text-zinc-400 mt-1">Posez-moi toutes vos questions sur les cours.</p>
        </div>

        <!-- Messages -->
        <div *ngFor="let msg of messages" class="flex" [ngClass]="isUserMessage(msg) ? 'justify-end' : 'justify-start'">
          <!-- Avatar de l'assistant (gauche) -->
          <div *ngIf="!isUserMessage(msg)" class="w-7 h-7 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center shrink-0 mr-2 mt-1">
            <mat-icon class="text-[14px]">smart_toy</mat-icon>
          </div>

          <div
            class="max-w-[75%] px-4 py-2.5 text-sm leading-relaxed"
            [ngClass]="isUserMessage(msg)
              ? 'bg-primary-600 text-white rounded-2xl rounded-br-md shadow-sm'
              : 'bg-white text-zinc-700 border border-zinc-200 rounded-2xl rounded-bl-md shadow-sm'"
          >
            <p>{{ msg.content }}</p>

            <button
              *ngIf="!isUserMessage(msg) && msg.media_url"
              (click)="playAudio(msg.media_url!)"
              class="mt-2 inline-flex items-center gap-1 text-[11px] font-medium text-primary-600 hover:text-primary-700 transition-colors"
            >
              <mat-icon class="text-[14px]">play_circle</mat-icon>
              Écouter
            </button>
          </div>
        </div>

        <!-- Indicateur "typing" -->
        <div *ngIf="sending" class="flex items-center gap-2 pl-9">
          <div class="flex gap-1 px-4 py-3 bg-zinc-100 rounded-2xl rounded-bl-md">
            <span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce [animation-delay:0ms]"></span>
            <span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce [animation-delay:150ms]"></span>
            <span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce [animation-delay:300ms]"></span>
          </div>
        </div>
      </div>

      <!-- Barre de saisie -->
      <div class="border-t border-zinc-200 px-5 py-3 shrink-0">
        <form (ngSubmit)="sendMessage()" class="flex items-center gap-2">
          <input
            type="text"
            [(ngModel)]="messageText"
            name="message"
            class="input-field flex-1"
            placeholder="Écrivez votre message…"
            [disabled]="sending || !activeConversationId"
          >
          <button
            type="submit"
            class="btn-primary px-3 py-2.5"
            [disabled]="!messageText.trim() || sending || !activeConversationId"
          >
            <mat-icon class="text-[18px]">{{ sending ? 'hourglass_empty' : 'send' }}</mat-icon>
          </button>
        </form>
      </div>
    </main>
  </div>
</div>
