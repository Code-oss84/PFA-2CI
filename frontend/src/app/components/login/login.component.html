<!-- Page de connexion -->
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md p-8 animate-fade-in">
    <!-- En-tête -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-violet-50 border border-violet-100 flex items-center justify-center mb-4">
        <mat-icon class="text-violet-600" style="font-size: 24px; width: 24px; height: 24px;">school</mat-icon>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Bienvenue</h1>
      <p class="text-sm text-zinc-500 mt-1.5">Connectez-vous pour continuer votre apprentissage</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div class="space-y-1.5">
        <label class="block text-sm font-medium text-zinc-700">Email</label>
        <div class="relative">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400" style="font-size: 18px; width: 18px; height: 18px;">mail</mat-icon>
          <input
            type="email"
            formControlName="email"
            class="input-field pl-10"
            placeholder="votre@email.com"
          >
        </div>
        <div *ngIf="f['email'].touched && f['email'].errors" class="text-red-500 text-xs mt-1">
          <span *ngIf="f['email'].errors['required']">L'email est requis</span>
          <span *ngIf="f['email'].errors['email']">Email invalide</span>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="space-y-1.5">
        <label class="block text-sm font-medium text-zinc-700">Mot de passe</label>
        <div class="relative">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400" style="font-size: 18px; width: 18px; height: 18px;">lock</mat-icon>
          <input
            type="password"
            formControlName="password"
            class="input-field pl-10"
            placeholder="Votre mot de passe"
          >
        </div>
        <div *ngIf="f['password'].touched && f['password'].errors" class="text-red-500 text-xs mt-1">
          Le mot de passe est requis
        </div>
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm">
        <mat-icon style="font-size: 16px; width: 16px; height: 16px; flex-shrink: 0;">error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Bouton de connexion -->
      <button
        type="submit"
        class="btn-primary w-full h-11"
        [disabled]="loading || loginForm.invalid"
      >
        <mat-icon *ngIf="loading" style="font-size: 18px; width: 18px; height: 18px;" class="animate-spin">refresh</mat-icon>
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading">Connexion...</span>
      </button>
    </form>

    <!-- Lien vers l'inscription -->
    <div class="mt-6 pt-5 border-t border-zinc-100 text-center">
      <p class="text-sm text-zinc-500">
        Pas encore de compte ?
        <a routerLink="/register" class="font-medium text-violet-600 hover:text-violet-700 transition-colors">
          Inscrivez-vous
        </a>
      </p>
    </div>
  </div>
</div>
