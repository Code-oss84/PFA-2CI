# ============================================
# Configuration nginx pour le frontend Angular
# Sert l'application et redirige /api vers le backend
# ============================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Autorise les uploads jusqu'à 10 Mo (photos d'avatar)
    client_max_body_size 10m;

    # Comportement SPA (redirige toutes les routes vers index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy les appels API vers le backend (port 3000)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy les fichiers uploadés (images, vidéos)
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
